<!DOCTYPE html>
<html>
<head>
  <title>CountyClaimTracker – Search</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">CountyClaimTracker</div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>

  <!-- PAGE CONTAINER -->
  <div class="page-container">

    <h1>Search Refund Records</h1>
    <p>Enter a last name to find potential county refunds.</p>

    <!-- SEARCH BOX -->
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="Enter last name (e.g., Smith)">
      <button onclick="runSearch()">Search</button>
    </div>

    <!-- RESULTS -->
    <div id="results"></div>

  </div>

  <!-- SEARCH LOGIC -->
  <script src="search.js"></script>

</body>
</html>
