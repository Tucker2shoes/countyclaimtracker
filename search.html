<!DOCTYPE html>
<html>

  <!-- BRANDING -->

  <!-- YOUR SEARCH.JS -->
  <script src="search.js" defer></script>

</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">CountyClaimTracker</div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>

  <div class="page-container">

    <h1>Search Refund Records</h1>

    <div id="results"></div>
