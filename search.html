<!DOCTYPE html>
<html>
<head>
  <title>CountyClaimTracker – Search</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- Global Supabase Client -->
  <script src="supabase.js"></script>

  <!-- Search Logic -->
  <script src="search.js" defer></script>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">CountyClaimTracker</div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="pricing.html">Pricing</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>

  <!-- PAGE CONTAINER -->
  <div class="page-container">

    <h1>Search Refund Records</h1>
    <p>Enter a last name to check for available county refunds.</p>

    <!-- SEARCH FORM -->
    <form id="searchForm" class="search-form">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Enter last name (e.g., Smith)" 
        required
      >
      <button type="submit" class="primary-btn">Search</button>
    </form>

    <!-- RESULTS -->
    <div id="resultsBox" class="results-container">
      <!-- Search results will appear here -->
    </div>

  </div>

</body>
</html>
