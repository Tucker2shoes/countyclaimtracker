<!DOCTYPE html>
<html>
<head>
  <title>CountyClaimTracker – Checkout</title>
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- Checkout Logic -->
  <script src="checkout.js" defer></script>
</head>

<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <div class="logo">CountyClaimTracker</div>
    <div class="nav-right">
      <a href="index.html">Home</a>
      <a href="search.html">Search</a>
      <a href="pricing.html">Pricing</a>
      <a href="admin.html">Admin</a>
    </div>
  </div>

  <!-- PAGE CONTAINER -->
  <div class="page-container">

    <h1>Checkout</h1>
    <p>Review your selected product and proceed to secure payment.</p>

    <!-- PRODUCT DETAILS -->
    <div id="productDetails" class="checkout-card">
      Loading product...
    </div>

    <!-- RECORD DETAILS (if coming from search) -->
    <div id="recordDetails" class="checkout-card" style="display:none;">
      Loading record...
    </div>

    <!-- CHECKOUT BUTTON -->
    <button id="checkoutButton" class="primary-btn" style="display:none;">
      Continue to Payment
    </button>

  </div>

</body>
</html>
